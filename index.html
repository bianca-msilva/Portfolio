<!DOCTYPE html>
<html lang="pt-br">
<head>  

    <!-- Servidores de Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 
    <!-- Fonte do Google - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <!-- Padrão do Caracteres -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tags Essenciais -->
    <meta name ="author" content="Bianca Silva">
    <meta name ="description" content="Portfólio de Bianca Silva, desenvolvedora Full Stack. Conheça meus projetos e entre em contato!">
    <!-- Para fazer otimização da busca pelo index (1° página) e depois segue para as demais (subpáginas) -->
    <meta name="robots" content="index, follow"> 
    <!-- Ícone do lado do nome do site (URL) -->
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">

    <!-- Link para o arquivo CSS -->
    <link rel="stylesheet" href="./assets/css/styles.css">

    <!-- Título da página -->
    <title>Portfólio da Bianca</title>
</head>
<body>
    <!-- Navbar - Menu -->
    <!-- Duas classes para serem posteriormente configuradas -->
    <header class="flex menu_container">
        <!-- Parte interna do menu -->
        <article class="menu_content">
            <div id="titulo">
                <!-- Para quando clicar, volte no início do site, "a" é para links -->
                <a href="#">Portfólio</a>    
            </div>

            <!-- Barra de Navegador -->
            <nav>
                <ul class="flex menu_list">
                    <!-- Para que parte vai passar, hero, primeira página/coisa que aparece no site -->
                    <li><a href="#hero">Início</a></li>
                    <li><a href="#about">Sobre</a></li>
                    <li><a href="#contact">Contato</a></li>
                </ul>
            </nav>
        </article>
    </header>

    <!-- Área Principal do Site -->
    <main>
        <section id="hero" class="hero_container">

            <article class="hero_content">
                <h4>👋 Olá, eu sou a Bianca</h4>
                <h1>Desenvolvedora Full Stack</h1>
                <p>Transformo criatividade em código e inovação em experiência.</p>
                <div class="hero_buttons">
                    <!-- # faz "referência à" -->
                    <a href="#contact" class="botao">Entre em contato</a>
                    <!-- Botão sem preenchimento -->
                    <a href="#about" class="botao-outline">Saiba mais...</a>
                </div>
            </article>
            <figure class="hero_image">
                <!-- Texto alternativo caso a imagem não esteja aparecendo - "alt=""" -->
                <img 
                    src="./assets/img/dev_woman.svg" 
                    alt="Ilustração de uma desenvolvedora trabalhando em um laptop."
                    class="ilustracao float-animation">
            </figure>
        </section>
    
        <section id="about" class="about_container">
            
        </section>

        <!-- Seção de contato -->
        <section id="contact" class="contact_container">
            <article class="contact_info">
                <h4>Entre em contato</h4>
                <p>Entre em contato e vamos criar algo incrível juntos!</p>
                <div class="social_container">
                    <a href="#" target="_blank" class="social_icon">
                        <img 
                            src="./assets/img/linkedin.svg"
                            alt="Link para o LinkedIn"
                        >
                    </a>
                        <a href="#" target="_blank" class="social_icon">
                        <img 
                            src="./assets/img/github.svg"
                            alt="Link para o GitHub"
                        >
                    </a>
                        <a href="#" target="_blank" class="social_icon">
                        <img 
                            src="./assets/img/instagram.svg"
                            alt="Link para o Instagram"
                        >
                    </a>
                </div>
            </article>

            <!-- Seção de formulário -->
            <form action="https://formsubmit.co/1f324e80ca6f8a4c90d74bcf4447c55d" method="POST" id="formulario">
                
                <!-- Campos ocultos no formulário -->
                <input type="hidden" name="_next" value="http://127.0.0.1:5500/sucess.html">
                <input type="hidden" name="_captcha" value="false"> <!-- Não exibir o captcha na hora de enviar e-mail -->
                
                <!-- Título do input -->
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" placeholder="Digite o seu nome completo">
                <!-- Para exibir mensagem de erro, embaixo do input -->
                <span id="txtNome"></span>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="Digite o seu email">
                <span id="txtEmail"></span>

                <label for="assunto">Assunto</label>
                <input id="assunto" name="assunto" type="text" placeholder="Digite o assunto">
                <span id="txtAssunto"></span>

                <!-- Caixa de texto maior, para mais texto -->
                <!-- Tem como colocar atributos como col="" e rows="" para estabelecer o tanto de colunas e linhas, respectivamente -->
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Escreva a sua mensagem aqui..."></textarea>

                <button class="botao" type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <!-- Rodapé do Site -->
    <footer>
        Feito com ❤️ por Bianca - 2025
    </footer>

    <script src="./assets/js/scripts.js"></script>

</body>
</html>
